<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 | TAGby Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', -apple-system, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; }

    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: #0f0f0f; border-bottom: 1px solid #1e1e1e;
      padding: 0 24px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: #666; font-size: 13px; text-decoration: none;
      padding: 6px 12px; border: 1px solid #2d2d2d; border-radius: 8px;
      transition: all .15s;
    }
    .back-btn:hover { color: #ccc; border-color: #555; }
    .topbar-title { font-size: 14px; font-weight: 700; color: #fff; }

    .container { max-width: 800px; margin: 0 auto; padding: 40px 24px 80px; }

    /* 프로필 카드 */
    .profile-card {
      background: #1a1a1a; border: 1px solid #2d2d2d; border-radius: 16px;
      padding: 28px; margin-bottom: 32px;
      display: flex; align-items: center; gap: 20px;
    }
    .avatar-wrap { position: relative; flex-shrink: 0; }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: #0078F0; display: flex; align-items: center; justify-content:center;
      font-size: 28px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .profile-info { flex: 1; }
    .profile-name-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .profile-name { font-size: 20px; font-weight: 800; }
    .name-edit-btn {
      background: none; border: none; color: #444; cursor: pointer;
      font-size: 13px; padding: 2px 4px; border-radius: 4px;
      transition: color .15s;
    }
    .name-edit-btn:hover { color: #aaa; }
    .name-edit-wrap { display: none; align-items: center; gap: 8px; margin-bottom: 4px; }
    .name-input {
      font-size: 18px; font-weight: 700; background: #111; border: 1px solid #333;
      border-radius: 8px; padding: 4px 10px; color: #fff; font-family: inherit;
      width: 180px;
    }
    .name-input:focus { outline: none; border-color: #0078F0; }
    .name-save-btn {
      background: #0078F0; color: #fff; border: none; border-radius: 6px;
      padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .name-cancel-btn {
      background: transparent; color: #666; border: 1px solid #333; border-radius: 6px;
      padding: 5px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .profile-email { font-size: 13px; color: #666; margin-bottom: 12px; }
    .profile-stats { display: flex; gap: 20px; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 18px; font-weight: 800; color: #fff; }
    .stat-label { font-size: 11px; color: #555; margin-top: 2px; }

    /* 섹션 */
    .section-title {
      font-size: 13px; font-weight: 700; color: #666;
      letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* 아티클 리스트 */
    .article-list { display: flex; flex-direction: column; gap: 10px; }
    .article-item {
      background: #1a1a1a; border: 1px solid #2d2d2d; border-radius: 12px;
      padding: 16px 20px; display: flex; align-items: center; gap: 14px;
      text-decoration: none; color: inherit; transition: border-color .15s;
    }
    .article-item:hover { border-color: #0078F0; }
    .article-thumb {
      width: 56px; height: 42px; border-radius: 6px; object-fit: cover;
      background: #111; flex-shrink: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .article-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .article-info { flex: 1; min-width: 0; }
    .article-title {
      font-size: 14px; font-weight: 700; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .article-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .cat-badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; background: #0d1f3c; color: #4d8fff;
    }
    .status-badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
    }
    .status-published { background: #0d2d1a; color: #4ade80; }
    .status-draft { background: #2d2000; color: #facc15; }
    .article-date { font-size: 11px; color: #555; }

    .article-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .action-btn {
      font-size: 11px; font-weight: 600; padding: 5px 12px;
      border-radius: 6px; border: 1px solid #333; background: transparent;
      color: #666; cursor: pointer; font-family: inherit; transition: all .15s;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .action-btn:hover { border-color: #555; color: #ccc; }
    .action-btn.view { border-color: #0078F0; color: #0078F0; }
    .action-btn.view:hover { background: #0078F0; color: #fff; }
    .action-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* 빈 상태 */
    .empty-state {
      text-align: center; padding: 48px 24px;
      background: #1a1a1a; border: 1px solid #2d2d2d; border-radius: 12px;
    }
    .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: .4; }
    .empty-text { color: #555; font-size: 14px; margin-bottom: 16px; }
    .write-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #0078F0; color: #fff; border: none; border-radius: 8px;
      padding: 10px 20px; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit; text-decoration: none;
      transition: background .2s;
    }
    .write-btn:hover { background: #005fbe; }

    /* 로딩 */
    .skeleton {
      background: linear-gradient(90deg, #1a1a1a 25%, #222 50%, #1a1a1a 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite;
      border-radius: 12px; height: 74px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    input[type="file"] { display: none; }

    @media (max-width: 600px) {
      .profile-card { flex-direction: column; align-items: flex-start; }
      .article-item { flex-wrap: wrap; }
      .article-actions { width: 100%; }
    }
  </style>
</head>
<body>

<!-- 상단바 -->
<div class="topbar">
  <div class="topbar-left">
    <a href="admin-article.html" class="back-btn">← 글쓰기</a>
    <span class="topbar-title">마이페이지</span>
  </div>
  <a href="tagby-article.html" class="back-btn">아티클 목록 →</a>
</div>

<!-- 로그인 필요 화면 -->
<div id="loginWall" style="display:none; min-height:80vh; flex-direction:column; gap:12px; align-items:center; justify-content:center;">
  <div style="font-size:32px; opacity:.3;">🔒</div>
  <p style="color:#666; font-size:14px;">로그인이 필요합니다</p>
  <a href="admin-article.html" class="write-btn">로그인하러 가기</a>
</div>

<!-- 메인 컨텐츠 -->
<div id="mainContent" style="display:none;">
  <div class="container">

    <!-- 프로필 카드 -->
    <div class="profile-card">
      <div class="avatar-wrap">
        <div class="avatar" id="profileAvatar"></div>
      </div>
      <div class="profile-info">
        <div class="profile-name-wrap">
          <div class="profile-name" id="profileName">—</div>
          <button class="name-edit-btn" onclick="startEditName()" title="닉네임 수정">✏️</button>
        </div>
        <div class="name-edit-wrap" id="nameEditWrap">
          <input class="name-input" id="nameInput" type="text" maxlength="20" placeholder="닉네임" onkeydown="if(event.key==='Enter')saveName();if(event.key==='Escape')cancelEditName()">
          <button class="name-save-btn" onclick="saveName()">저장</button>
          <button class="name-cancel-btn" onclick="cancelEditName()">취소</button>
        </div>
        <div class="profile-email" id="profileEmail">—</div>
        <div class="profile-stats">
          <div class="stat-item">
            <div class="stat-num" id="statPublished">—</div>
            <div class="stat-label">게시됨</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="statDraft">—</div>
            <div class="stat-label">임시저장</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="statTotal">—</div>
            <div class="stat-label">전체</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 내가 쓴 글 -->
    <div class="section-title">내가 쓴 글</div>
    <div id="articleList" class="article-list">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>

  </div>
</div>


<script>
const token = localStorage.getItem('tagby_article_token') || ''
let currentUser = null

function showLoginWall() {
  const el = document.getElementById('loginWall')
  el.style.display = 'flex'
}

async function init() {
  if (!token) { showLoginWall(); return }
  try {
    const res = await fetch('/api/article-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ action: 'verify' })
    })
    const data = await res.json()
    if (!res.ok) throw new Error()
    currentUser = data.user
    showMain()
  } catch {
    showLoginWall()
  }
}

function showMain() {
  document.getElementById('mainContent').style.display = 'block'

  const name = currentUser.name || currentUser.email.split('@')[0]
  document.getElementById('profileName').textContent = name
  document.getElementById('profileEmail').textContent = currentUser.email
  document.getElementById('profileAvatar').textContent = name.charAt(0).toUpperCase()

  loadMyArticles()
}

async function loadMyArticles() {
  const res = await fetch('/api/my-articles', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  const articles = res.ok ? await res.json() : []

  const published = articles.filter(a => a.status === 'published')
  const drafts = articles.filter(a => a.status === 'draft')
  document.getElementById('statPublished').textContent = published.length
  document.getElementById('statDraft').textContent = drafts.length
  document.getElementById('statTotal').textContent = articles.length

  const listEl = document.getElementById('articleList')
  if (articles.length === 0) {
    listEl.innerHTML = '<div class="empty-state">'
      + '<div class="empty-icon">📝</div>'
      + '<div class="empty-text">아직 작성한 글이 없어요</div>'
      + '<a href="admin-article.html" class="write-btn">첫 아티클 작성하기</a>'
      + '</div>'
    return
  }

  const CAT_SHORT = { '퍼포먼스마케팅': '퍼포먼스', '콘텐츠마케팅': '콘텐츠', '디자인': '디자인', 'AI': 'AI' }

  listEl.innerHTML = articles.map(function(a) {
    const dateStr = a.published_at ? a.published_at.slice(0,10).replace(/-/g, '. ') : ''
    const statusBadge = a.status === 'published'
      ? '<span class="status-badge status-published">게시됨</span>'
      : '<span class="status-badge status-draft">임시저장</span>'
    const thumbHtml = a.cover_url
      ? '<img src="' + esc(a.cover_url) + '" alt="">'
      : '<div style="width:100%;height:100%;background:linear-gradient(135deg,#0c1f5e,#1a4db8);border-radius:6px;"></div>'
    const viewBtn = a.status === 'published'
      ? '<a href="article-view.html?slug=' + esc(a.slug) + '" target="_blank" class="action-btn view">보기</a>'
      : ''
    const editBtn = '<a href="admin-article.html?edit=' + esc(a.slug) + '" class="action-btn">수정</a>'
    const delBtn = '<button class="action-btn" style="color:#f87171;border-color:#f87171;" onclick="deleteArticle(\'' + esc(a.slug) + '\', this)">삭제</button>'
    return '<div class="article-item" data-slug="' + esc(a.slug) + '">'
      + '<div class="article-thumb">' + thumbHtml + '</div>'
      + '<div class="article-info">'
      + '<div class="article-title">' + esc(a.title) + '</div>'
      + '<div class="article-meta">'
      + '<span class="cat-badge">' + esc(CAT_SHORT[a.category] || a.category) + '</span>'
      + statusBadge
      + (dateStr ? '<span class="article-date">' + dateStr + '</span>' : '')
      + '</div>'
      + '</div>'
      + '<div class="article-actions">' + viewBtn + editBtn + delBtn + '</div>'
      + '</div>'
  }).join('')
}

async function deleteArticle(slug, btn) {
  if (!confirm('정말 삭제하시겠어요? 되돌릴 수 없습니다.')) return
  btn.disabled = true
  btn.textContent = '삭제 중...'
  try {
    const res = await fetch('/api/my-articles', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ action: 'delete', slug })
    })
    if (!res.ok) throw new Error()
    const item = document.querySelector('[data-slug="' + slug + '"]')
    if (item) item.remove()
    // 통계 재로드
    await loadMyArticles()
  } catch {
    btn.disabled = false
    btn.textContent = '삭제'
    alert('삭제에 실패했습니다.')
  }
}

function startEditName() {
  const current = document.getElementById('profileName').textContent
  document.getElementById('nameInput').value = current
  document.querySelector('.profile-name-wrap').style.display = 'none'
  const wrap = document.getElementById('nameEditWrap')
  wrap.style.display = 'flex'
  document.getElementById('nameInput').focus()
}

function cancelEditName() {
  document.getElementById('nameEditWrap').style.display = 'none'
  document.querySelector('.profile-name-wrap').style.display = 'flex'
}

async function saveName() {
  const newName = document.getElementById('nameInput').value.trim()
  if (!newName) return
  const btn = document.querySelector('.name-save-btn')
  btn.disabled = true
  btn.textContent = '저장 중...'
  try {
    const res = await fetch('/api/article-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ action: 'update-name', name: newName })
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error)
    document.getElementById('profileName').textContent = newName
    document.getElementById('profileAvatar').textContent = newName.charAt(0).toUpperCase()
    currentUser.name = newName
    cancelEditName()
  } catch(err) {
    alert(err.message || '닉네임 변경에 실패했습니다.')
  } finally {
    btn.disabled = false
    btn.textContent = '저장'
  }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

init()
</script>
</body>
</html>
