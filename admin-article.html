<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아티클 작성 | TAGby Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Pretendard', sans-serif; background: #0f0f0f; color: #fff; }
    .card { background: #1a1a1a; border: 1px solid #2d2d2d; border-radius: 12px; }
    .input-base {
      background: #111; border: 1px solid #333; border-radius: 8px;
      color: #fff; padding: 10px 14px; font-size: 14px; width: 100%;
      font-family: 'Pretendard', sans-serif; outline: none; transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .input-base:focus { border-color: #0078F0; }
    .input-base::placeholder { color: #555; }
    textarea.input-base { resize: vertical; }
    select.input-base option { background: #1a1a1a; }
    .btn-primary {
      background: #0078F0; color: #fff; border: none; border-radius: 8px;
      padding: 12px 28px; font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: 'Pretendard', sans-serif; transition: background 0.2s;
    }
    .btn-primary:hover { background: #005fbe; }
    .btn-primary:disabled { background: #333; color: #666; cursor: not-allowed; }
    .btn-secondary {
      background: transparent; color: #888; border: 1px solid #333; border-radius: 8px;
      padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: 'Pretendard', sans-serif; transition: all 0.2s;
    }
    .btn-secondary:hover { border-color: #555; color: #ccc; }
    .label { font-size: 13px; font-weight: 600; color: #aaa; margin-bottom: 6px; display: block; }
    .label span { color: #f87171; margin-left: 2px; }
    .section-card { background: #1a1a1a; border: 1px solid #2d2d2d; border-radius: 12px; padding: 24px; }
    .type-btn {
      flex: 1; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
      border: 1px solid #333; border-radius: 8px; background: #111; color: #666;
      font-family: 'Pretendard', sans-serif; transition: all 0.2s; text-align: center;
    }
    .type-btn.active { background: #0078F0; border-color: #0078F0; color: #fff; }
    .drop-zone {
      border: 2px dashed #333; border-radius: 10px; padding: 32px;
      text-align: center; cursor: pointer; transition: border-color 0.2s;
    }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #0078F0; }
    .slide-item {
      background: #111; border: 1px solid #2d2d2d; border-radius: 8px;
      padding: 10px; display: flex; align-items: center; gap: 10px;
    }
    .slide-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
    .toast {
      position: fixed; bottom: 24px; right: 24px; padding: 14px 20px;
      border-radius: 10px; font-size: 14px; font-weight: 600; z-index: 9999;
      transform: translateY(100px); opacity: 0; transition: all 0.3s; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: #1a3a1a; border: 1px solid #2d7a2d; color: #4ade80; }
    .toast.error   { background: #3a1a1a; border: 1px solid #7a2d2d; color: #f87171; }
    /* 이미지 캡션 모달 */
    #imgCaptionModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:9999; align-items:center; justify-content:center; }
    #imgCaptionModal.open { display:flex; }
    /* Quill 에디터 다크 테마 */
    .ql-toolbar.ql-snow {
      background: #1e1e1e; border: 1px solid #333; border-bottom: none;
      border-radius: 8px 8px 0 0; padding: 8px 12px;
    }
    .ql-container.ql-snow {
      background: #111; border: 1px solid #333; border-radius: 0 0 8px 8px;
      min-height: 400px; font-family: 'Pretendard', sans-serif; font-size: 15px;
    }
    .ql-editor { min-height: 400px; line-height: 1.85; color: #e0e0e0; padding: 16px 20px; }
    .ql-editor.ql-blank::before { color: #555; font-style: normal; }
    .ql-editor h2 { color: #fff; font-size: 1.4em; font-weight: 700; margin: 1.2em 0 0.5em; }
    .ql-editor h3 { color: #fff; font-size: 1.15em; font-weight: 700; margin: 1em 0 0.4em; }
    .ql-editor p  { margin: 0 0 0.75em; }
    .ql-editor img { max-width: 100%; border-radius: 8px; margin: 8px 0; }
    .ql-editor blockquote { border-left: 3px solid #0078F0; padding-left: 14px; color: #aaa; font-style: italic; margin: 1em 0; }
    .ql-editor figure { margin: 8px 0; }
    .ql-editor figcaption { text-align: center; font-size: 12px; color: #888; margin-top: 5px; font-style: italic; padding: 0 12px; }
    .ql-snow .ql-stroke { stroke: #999; }
    .ql-snow .ql-fill  { fill: #999; }
    .ql-snow .ql-picker { color: #999; }
    .ql-snow .ql-picker-options { background: #222; border-color: #333; color: #ccc; }
    .ql-snow .ql-picker-item:hover, .ql-snow .ql-picker-item.ql-selected { color: #0078F0; }
    .ql-snow.ql-toolbar button:hover .ql-stroke,
    .ql-snow .ql-toolbar button:hover .ql-stroke,
    .ql-snow.ql-toolbar button.ql-active .ql-stroke,
    .ql-snow .ql-toolbar button.ql-active .ql-stroke { stroke: #0078F0; }
    .ql-snow.ql-toolbar button:hover .ql-fill,
    .ql-snow .ql-toolbar button:hover .ql-fill,
    .ql-snow.ql-toolbar button.ql-active .ql-fill,
    .ql-snow .ql-toolbar button.ql-active .ql-fill  { fill: #0078F0; }
    .ql-snow .ql-picker-label:hover, .ql-snow .ql-picker-label.ql-active { color: #0078F0; }
    .ql-snow .ql-tooltip { background: #1e1e1e; border-color: #333; color: #ccc; }
    .ql-snow .ql-tooltip input[type=text] { background: #111; border-color: #444; color: #fff; outline: none; }
    .ql-snow .ql-tooltip a.ql-action::after { color: #0078F0; border-right-color: #333; }
    .ql-snow .ql-tooltip a.ql-remove::before { color: #f87171; }
    #loginScreen, #editorScreen { transition: opacity 0.2s; }
    .tag-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #1a1a1a; border: 1px solid #333; border-radius: 20px;
      padding: 4px 10px; font-size: 12px; color: #ccc;
    }
    .tag-badge button { background: none; border: none; color: #666; cursor: pointer; font-size: 14px; padding: 0; line-height: 1; }
    .tag-badge button:hover { color: #f87171; }
    .char-count { font-size: 11px; color: #555; text-align: right; margin-top: 4px; }
  </style>
</head>
<body>

<!-- ── 로그인 화면 ──────────────────────────────────────────── -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div style="font-size:24px; font-weight:800; color:#fff; letter-spacing:-0.5px;">TAGby</div>
      <div style="font-size:13px; color:#666; margin-top:4px;">아티클 작성 어드민</div>
    </div>
    <!-- 탭 -->
    <div style="display:flex; background:#1a1a1a; border:1px solid #2d2d2d; border-radius:10px; padding:4px; margin-bottom:16px; gap:4px;">
      <button id="tabLogin" onclick="switchTab('login')" style="flex:1;padding:9px;font-size:13px;font-weight:700;border:none;border-radius:7px;cursor:pointer;font-family:'Pretendard',sans-serif;background:#0078F0;color:#fff;transition:all 0.2s;">로그인</button>
      <button id="tabSignup" onclick="switchTab('signup')" style="flex:1;padding:9px;font-size:13px;font-weight:700;border:none;border-radius:7px;cursor:pointer;font-family:'Pretendard',sans-serif;background:transparent;color:#666;transition:all 0.2s;">계정 만들기</button>
    </div>
    <!-- 로그인 폼 -->
    <div id="loginForm" class="section-card">
      <div class="mb-4">
        <label class="label">이메일</label>
        <input id="loginEmail" type="email" class="input-base" placeholder="이메일 주소" autocomplete="email">
      </div>
      <div class="mb-6">
        <label class="label">비밀번호</label>
        <input id="loginPassword" type="password" class="input-base" placeholder="비밀번호" autocomplete="current-password">
      </div>
      <button id="loginBtn" class="btn-primary w-full" onclick="doLogin()">로그인</button>
      <div id="loginError" style="color:#f87171; font-size:13px; margin-top:12px; text-align:center; display:none;"></div>
    </div>
    <!-- 계정 만들기 폼 -->
    <div id="signupForm" class="section-card" style="display:none;">
      <div class="mb-4">
        <label class="label">이름</label>
        <input id="signupName" type="text" class="input-base" placeholder="이름 (아티클에 작성자로 표시됩니다)">
      </div>
      <div class="mb-4">
        <label class="label">이메일</label>
        <input id="signupEmail" type="email" class="input-base" placeholder="이메일 주소" autocomplete="email">
      </div>
      <div class="mb-6">
        <label class="label">비밀번호 <span style="color:#555;font-weight:400;">(8자 이상)</span></label>
        <input id="signupPassword" type="password" class="input-base" placeholder="비밀번호 8자 이상" autocomplete="new-password">
      </div>
      <button id="signupBtn" class="btn-primary w-full" onclick="doSignup()">계정 만들기</button>
      <div id="signupError" style="color:#f87171; font-size:13px; margin-top:12px; text-align:center; display:none;"></div>
    </div>
  </div>
</div>

<!-- ── 에디터 화면 ──────────────────────────────────────────── -->
<div id="editorScreen" style="display:none;">
  <!-- 상단 헤더 -->
  <header style="background:#0f0f0f; border-bottom:1px solid #1e1e1e; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="font-size:16px; font-weight:800; color:#fff;">TAGby</div>
      <div style="width:1px; height:16px; background:#333;"></div>
      <div style="font-size:13px; color:#666;">아티클 작성</div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span id="userBadge" style="font-size:12px; color:#666; background:#1a1a1a; border:1px solid #2d2d2d; border-radius:20px; padding:4px 12px;"></span>
      <a href="my-page.html" class="btn-secondary" style="padding:7px 14px; font-size:12px; text-decoration:none;">마이페이지</a>
      <button class="btn-secondary" onclick="doLogout()" style="padding:7px 14px; font-size:12px;">로그아웃</button>
    </div>
  </header>

  <div class="max-w-3xl mx-auto p-6" style="padding-bottom:80px;">

    <!-- 아티클 타입 선택 -->
    <div class="section-card mb-5">
      <label class="label" style="margin-bottom:10px;">아티클 유형</label>
      <div style="display:flex; gap:10px;">
        <button class="type-btn active" id="typeText" onclick="setType('text')">📝 텍스트 아티클</button>
        <button class="type-btn" id="typeCard" onclick="setType('card-news')">🎴 카드뉴스 (이미지 슬라이드)</button>
      </div>
    </div>

    <!-- 기본 정보 -->
    <div class="section-card mb-5">
      <div style="font-size:14px; font-weight:700; color:#fff; margin-bottom:16px;">기본 정보</div>

      <div class="mb-4">
        <label class="label">제목 <span>*</span></label>
        <input id="fTitle" type="text" class="input-base" placeholder="아티클 제목" maxlength="100" oninput="updateSlug(); updateCharCount('fTitle','titleCount',100)" onblur="flushSlug()">
        <div class="char-count"><span id="titleCount">0</span>/100</div>
      </div>

      <div class="mb-4" id="subtitleWrap">
        <label class="label">부제목</label>
        <input id="fSubtitle" type="text" class="input-base" placeholder="아티클 부제목 (선택)" maxlength="150" oninput="updateCharCount('fSubtitle','subtitleCount',150)">
        <div class="char-count"><span id="subtitleCount">0</span>/150</div>
      </div>

      <div class="mb-4">
        <label class="label">카테고리 <span>*</span></label>
        <select id="fCategory" class="input-base">
          <option value="">카테고리 선택</option>
          <option>퍼포먼스마케팅</option>
          <option>콘텐츠마케팅</option>
          <option>디자인</option>
          <option>AI</option>
        </select>
      </div>

      <div>
        <label class="label">태그</label>
        <div style="display:flex; gap:8px; margin-bottom:8px;">
          <input id="tagInput" type="text" class="input-base" style="flex:1;" placeholder="태그 입력 후 Enter 또는 쉼표" onkeydown="handleTagKey(event)">
          <button class="btn-secondary" style="white-space:nowrap;" onclick="addTag()">추가</button>
        </div>
        <div id="tagList" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
      </div>
    </div>

    <!-- 슬러그 -->
    <div class="section-card mb-5">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
        <label class="label" style="margin:0;">슬러그 <span>*</span></label>
        <span id="slugAutoHint" style="font-size:11px; color:#555;">제목을 입력하면 자동 생성됩니다</span>
      </div>
      <div style="display:flex; gap:8px;">
        <span style="padding:10px 14px; background:#111; border:1px solid #333; border-radius:8px; color:#555; font-size:13px; white-space:nowrap; flex-shrink:0;">mkt.tagby.io/article-view.html?slug=</span>
        <input id="fSlug" type="text" class="input-base" placeholder="my-article-slug" style="flex:1;" oninput="onSlugInput(this)">
      </div>
      <div style="font-size:11px; color:#555; margin-top:6px;">영문 소문자, 숫자, 하이픈(-)만 사용 가능합니다 · 수동 입력 시 자동 생성이 멈춥니다</div>
    </div>

    <!-- 커버 이미지 -->
    <div class="section-card mb-5">
      <label class="label" style="margin-bottom:10px;">커버 이미지 <span style="color:#555; font-weight:400;">(최대 2MB)</span></label>
      <div id="coverDropZone" class="drop-zone" onclick="document.getElementById('coverFileInput').click()" ondragover="handleDragOver(event,'coverDropZone')" ondragleave="handleDragLeave('coverDropZone')" ondrop="handleDrop(event,'cover')">
        <input id="coverFileInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none;" onchange="handleFileSelect(event,'cover')">
        <div id="coverPreviewWrap" style="display:none; position:relative;">
          <img id="coverPreview" style="max-height:200px; border-radius:8px; display:block; margin:0 auto;">
          <button onclick="event.stopPropagation(); removeCoverImage()" style="position:absolute; top:-8px; right:-8px; background:#333; border:none; border-radius:50%; width:24px; height:24px; color:#fff; cursor:pointer; font-size:14px; line-height:1;">×</button>
        </div>
        <div id="coverPlaceholder">
          <div style="font-size:28px; margin-bottom:8px;">🖼️</div>
          <div style="font-size:13px; color:#666;">클릭하거나 이미지를 드래그해서 올려주세요</div>
          <div style="font-size:11px; color:#444; margin-top:4px;">JPG, PNG, GIF, WebP · 최대 2MB</div>
        </div>
      </div>
      <div id="coverUploadStatus" style="font-size:12px; margin-top:8px; display:none;"></div>
    </div>

    <!-- 본문 (텍스트 아티클) -->
    <div id="bodySection" class="section-card mb-5">
      <label class="label" style="margin-bottom:12px;">본문 <span>*</span></label>
      <div id="quillEditor"></div>
    </div>

    <!-- 슬라이드 (카드뉴스) -->
    <div id="slidesSection" class="section-card mb-5" style="display:none;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
        <label class="label" style="margin:0;">슬라이드 이미지 <span>*</span> <span style="color:#555; font-weight:400;">(최대 2MB/장)</span></label>
        <button class="btn-secondary" style="padding:7px 14px; font-size:12px;" onclick="document.getElementById('slideFileInput').click()">+ 이미지 추가</button>
      </div>
      <input id="slideFileInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple style="display:none;" onchange="handleSlideSelect(event)">

      <div id="slidesEmpty" style="text-align:center; padding:32px; color:#555; font-size:13px;">
        이미지를 추가하면 슬라이드 순서대로 표시됩니다
      </div>
      <div id="slideList" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>

    <!-- 출처 -->
    <div class="section-card mb-5">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
        <div style="font-size:14px; font-weight:700; color:#fff;">출처 <span style="font-size:12px; font-weight:400; color:#555;">(선택)</span></div>
        <button onclick="addSourceRow()" class="btn-secondary" style="padding:6px 14px; font-size:12px;">+ 출처 추가</button>
      </div>
      <div id="sourceList"></div>
    </div>

    <!-- 게시 버튼 -->
    <div style="display:flex; gap:12px; justify-content:flex-end;">
      <button class="btn-secondary" onclick="saveDraft()">임시저장</button>
      <button id="publishBtn" class="btn-primary" onclick="publish()">아티클 게시</button>
    </div>

  </div>
</div>

<!-- 이미지 캡션 모달 -->
<div id="imgCaptionModal">
  <div style="background:#1a1a1a; border:1px solid #2d2d2d; border-radius:14px; padding:24px; width:400px; max-width:calc(100vw - 32px);">
    <div style="font-size:15px; font-weight:700; color:#fff; margin-bottom:6px;">이미지 캡션 / 출처</div>
    <div style="font-size:12px; color:#666; margin-bottom:14px;">이미지 하단에 캡션이나 출처를 표시합니다 (선택)</div>
    <input id="imgCaptionInput" type="text" class="input-base" placeholder="예: 출처: Meta Business Blog">
    <div style="display:flex; gap:8px; margin-top:16px; justify-content:flex-end;">
      <button onclick="insertImgWithCaption(false)" class="btn-secondary" style="padding:8px 16px; font-size:13px;">건너뛰기</button>
      <button onclick="insertImgWithCaption(true)" class="btn-primary" style="padding:8px 20px; font-size:13px;">삽입</button>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script>
// ── 상태 ──────────────────────────────────────────────────────
let token = localStorage.getItem('tagby_article_token') || ''
let currentUser = null
let articleType = 'text'
let coverUrl = null
let slides = []   // [{url, caption}]
let tags = []
let quill = null
let sources = [{ name: '', url: '' }]
const DRAFT_KEY = 'tagby_article_draft'

// ── 초기화 ────────────────────────────────────────────────────
window.addEventListener('beforeunload', function() { saveDraftLocally() })

window.addEventListener('DOMContentLoaded', function() {
  if (token) verifyAndShowEditor()
  document.getElementById('loginEmail').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('loginPassword').focus()
  })
  document.getElementById('loginPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin()
  })
  document.getElementById('signupName').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('signupEmail').focus()
  })
  document.getElementById('signupEmail').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('signupPassword').focus()
  })
  document.getElementById('signupPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doSignup()
  })
})

async function verifyAndShowEditor() {
  try {
    const res = await fetch('/api/article-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ action: 'verify' })
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error)
    currentUser = data.user
    showEditor()
  } catch {
    token = ''
    localStorage.removeItem('tagby_article_token')
  }
}

// ── 로그인 ────────────────────────────────────────────────────
function switchTab(tab) {
  const isLogin = tab === 'login'
  document.getElementById('tabLogin').style.background  = isLogin ? '#0078F0' : 'transparent'
  document.getElementById('tabLogin').style.color       = isLogin ? '#fff' : '#666'
  document.getElementById('tabSignup').style.background = isLogin ? 'transparent' : '#0078F0'
  document.getElementById('tabSignup').style.color      = isLogin ? '#666' : '#fff'
  document.getElementById('loginForm').style.display    = isLogin ? 'block' : 'none'
  document.getElementById('signupForm').style.display   = isLogin ? 'none' : 'block'
}

async function doSignup() {
  const name     = document.getElementById('signupName').value.trim()
  const email    = document.getElementById('signupEmail').value.trim()
  const password = document.getElementById('signupPassword').value
  const btn      = document.getElementById('signupBtn')
  const errEl    = document.getElementById('signupError')

  if (!name)     { errEl.textContent = '이름을 입력해주세요'; errEl.style.display='block'; return }
  if (!email)    { errEl.textContent = '이메일을 입력해주세요'; errEl.style.display='block'; return }
  if (!password) { errEl.textContent = '비밀번호를 입력해주세요'; errEl.style.display='block'; return }

  btn.disabled = true
  btn.textContent = '계정 생성 중...'
  errEl.style.display = 'none'

  try {
    const res = await fetch('/api/article-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'signup', email, password, name })
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error)

    token = data.access_token
    currentUser = data.user
    localStorage.setItem('tagby_article_token', token)
    showEditor()
  } catch (err) {
    errEl.textContent = err.message || '계정 생성에 실패했습니다'
    errEl.style.display = 'block'
  } finally {
    btn.disabled = false
    btn.textContent = '계정 만들기'
  }
}

async function loadArticleForEdit(slug) {
  try {
    const res = await fetch('/api/my-articles?slug=' + encodeURIComponent(slug), {
      headers: { 'Authorization': 'Bearer ' + token }
    })
    if (!res.ok) throw new Error()
    const a = await res.json()

    // 폼 채우기
    document.getElementById('fTitle').value = a.title || ''
    document.getElementById('fSubtitle').value = a.subtitle || ''
    document.getElementById('fSlug').value = a.slug || ''
    document.getElementById('fCategory').value = a.category || ''
    document.getElementById('fStatus').value = a.status || 'published'
    document.getElementById('fAuthorName').value = a.author_name || ''

    if (a.tags && Array.isArray(a.tags)) {
      tags = [...a.tags]
      renderTags()
    }
    if (a.cover_url) {
      coverUrl = a.cover_url
      document.getElementById('coverPreview').src = coverUrl
      document.getElementById('coverPreview').style.display = 'block'
      document.getElementById('coverPlaceholder').style.display = 'none'
    }
    if (a.body_html && quill) {
      quill.root.innerHTML = a.body_html
    }
    if (a.source_name || a.source_url) {
      const names = (a.source_name || '').split('||')
      const urls  = (a.source_url  || '').split('||')
      const count = Math.max(names.length, urls.length)
      sources = []
      for (let i = 0; i < count; i++) {
        sources.push({ name: names[i] || '', url: urls[i] || '' })
      }
      renderSources()
    }

    // 편집 모드 배너 표시
    const banner = document.createElement('div')
    banner.style.cssText = 'background:#1a2a1a;border:1px solid #2d5a2d;border-radius:8px;padding:10px 16px;margin-bottom:16px;font-size:13px;color:#4ade80;'
    banner.textContent = '✏️ 수정 모드 — "' + (a.title || slug) + '" 를 수정 중입니다.'
    const firstCard = document.querySelector('.section-card')
    if (firstCard) firstCard.parentNode.insertBefore(banner, firstCard)
  } catch {
    alert('아티클을 불러오는 데 실패했습니다.')
  }
}

let pendingImgUrl = null
let pendingImgRange = null

async function quillImageHandler() {
  const input = document.createElement('input')
  input.setAttribute('type', 'file')
  input.setAttribute('accept', 'image/jpeg,image/png,image/gif,image/webp')
  input.click()
  input.onchange = async () => {
    const file = input.files[0]
    if (!file) return
    try {
      showToast('이미지 업로드 중...', 'success')
      const url = await uploadImage(file)
      pendingImgUrl = url
      pendingImgRange = quill.getSelection() || { index: quill.getLength() }
      document.getElementById('imgCaptionInput').value = ''
      document.getElementById('imgCaptionModal').classList.add('open')
    } catch (err) {
      showToast(err.message, 'error')
    }
  }
}

function insertImgWithCaption(withCaption) {
  const caption = withCaption ? document.getElementById('imgCaptionInput').value.trim() : ''
  document.getElementById('imgCaptionModal').classList.remove('open')
  if (!pendingImgUrl) return
  const range = pendingImgRange || { index: quill.getLength() }
  if (caption) {
    const safe = caption.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    quill.clipboard.dangerouslyPasteHTML(range.index,
      '<figure><img src="' + pendingImgUrl + '"><figcaption>' + safe + '</figcaption></figure><p><br></p>')
  } else {
    quill.insertEmbed(range.index, 'image', pendingImgUrl)
    quill.setSelection(range.index + 1)
  }
  showToast('이미지 삽입 완료', 'success')
  pendingImgUrl = null
  pendingImgRange = null
}

// Enter 키로 캡션 삽입
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('imgCaptionModal').classList.contains('open')) {
    e.preventDefault()
    insertImgWithCaption(true)
  }

// ── 슬러그 ────────────────────────────────────────────────────
let slugManuallyEdited = false
let slugDebounceTimer = null

function updateSlug() {
  if (slugManuallyEdited) return
  const title = document.getElementById('fTitle').value.trim()
  const slugEl = document.getElementById('fSlug')
  const hintEl = document.getElementById('slugAutoHint')

  if (!title) {
    slugEl.value = ''
    hintEl.style.color = '#555'
    hintEl.textContent = '제목을 입력하면 자동 생성됩니다'
    return
  }

  const now = new Date()
  const mmdd = String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0')

  // 즉시 임시 슬러그 (영문 단어 추출)
  const tmpSlug = title.toLowerCase()
    .replace(/[가-힣ㄱ-ㅎㅏ-ㅣ]/g, ' ')
    .replace(/[^a-z0-9\s-]/g, '')
    .trim().replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '')
    .slice(0, 50)
  if (tmpSlug) {
    slugEl.value = tmpSlug + '-' + mmdd
  }
  hintEl.style.color = '#888'
  hintEl.textContent = '슬러그 생성 중...'

  // 400ms debounce 후 API로 의미 있는 영어 슬러그 생성
  clearTimeout(slugDebounceTimer)
  slugDebounceTimer = setTimeout(() => callSlugApi(title, mmdd), 400)
}

async function callSlugApi(title, mmdd) {
  if (slugManuallyEdited) return
  const slugEl = document.getElementById('fSlug')
  const hintEl = document.getElementById('slugAutoHint')
  if (!mmdd) {
    const now = new Date()
    mmdd = String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0')
  }
  try {
    const res = await fetch('/api/generate-slug', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    })
    const data = await res.json()
    if (data.slug && !slugManuallyEdited) {
      slugEl.value = data.slug + '-' + mmdd
      hintEl.style.color = '#4ade80'
      hintEl.textContent = '자동 생성됨 (수정 가능)'
    }
  } catch {
    if (!slugManuallyEdited && slugEl.value) {
      hintEl.style.color = '#4ade80'
      hintEl.textContent = '자동 생성됨 (수정 가능)'
    }
  }
}

function flushSlug() {
  if (slugManuallyEdited) return
  const title = document.getElementById('fTitle').value.trim()
  if (!title) return
  clearTimeout(slugDebounceTimer)
  const now = new Date()
  const mmdd = String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0')
  callSlugApi(title, mmdd)
}

function saveDraftLocally() {
  if (!quill) return
  try {
    const draft = {
      title: document.getElementById('fTitle').value,
      subtitle: document.getElementById('fSubtitle').value,
      category: document.getElementById('fCategory').value,
      slug: document.getElementById('fSlug').value,
      slugManuallyEdited,
      articleType,
      bodyHtml: quill.root.innerHTML,
      tags: [...tags],
      coverUrl,
      sources: sources.map(s => ({ name: s.name, url: s.url })),
      savedAt: new Date().toISOString()
    }
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft))
  } catch {}
}

function loadDraftLocally() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY)
    if (!raw) return
    const draft = JSON.parse(raw)
    if (!draft.savedAt) return
    const minAgo = Math.floor((Date.now() - new Date(draft.savedAt)) / 60000)
    const when = minAgo < 1 ? '방금' : minAgo < 60 ? minAgo + '분 전' : Math.floor(minAgo / 60) + '시간 전'
    if (!confirm('이전에 작성 중이던 내용이 있습니다 (' + when + ' 자동저장)\n불러올까요?')) {
      localStorage.removeItem(DRAFT_KEY)
      return
    }
    document.getElementById('fTitle').value = draft.title || ''
    document.getElementById('fSubtitle').value = draft.subtitle || ''
    document.getElementById('fCategory').value = draft.category || ''
    document.getElementById('fSlug').value = draft.slug || ''
    slugManuallyEdited = !!draft.slugManuallyEdited
    if (draft.articleType) { articleType = draft.articleType; setType(articleType) }
    tags = draft.tags || []
    renderTags()
    coverUrl = draft.coverUrl || null
    if (coverUrl) {
      document.getElementById('coverPreview').src = coverUrl
      document.getElementById('coverPreviewWrap').style.display = 'block'
      document.getElementById('coverPlaceholder').style.display = 'none'
    }
    sources = (draft.sources && draft.sources.length) ? draft.sources : [{ name: '', url: '' }]
    renderSources()
    if (draft.bodyHtml && draft.bodyHtml !== '<p><br></p>') {
      quill.clipboard.dangerouslyPasteHTML(0, draft.bodyHtml)
    }
    const hint = document.getElementById('slugAutoHint')
    if (hint && draft.slug) {
      hint.textContent = '임시저장에서 복원됨'
      hint.style.color = '#facc15'
    }
  } catch { localStorage.removeItem(DRAFT_KEY) }
}

// ── 이미지 업로드 (공통) ──────────────────────────────────────
const MAX_BYTES = 2 * 1024 * 1024

async function uploadImage(file) {
  if (file.size > MAX_BYTES) {
    throw new Error('이미지는 2MB 이하로 올려주세요 (현재: ' + (file.size/1024/1024).toFixed(1) + 'MB)')
  }

  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader()
    reader.onload = () => resolve(reader.result.split(',')[1])
    reader.onerror = reject
    reader.readAsDataURL(file)
  })

  const res = await fetch('/api/image-upload', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ base64, filename: file.name, contentType: file.type })
  })
  const data = await res.json()
  if (!res.ok) throw new Error(data.error)
  return data.url
}

async function generateCoverImage(title, category) {
  const canvas = document.createElement('canvas')
  canvas.width = 800
  canvas.height = 600
  const ctx = canvas.getContext('2d')

  const paletteSets = {
    '퍼포먼스마케팅': [
      { bg1: '#0c1f5e', bg2: '#1a4db8', accent: '#4d8fff', label: 'Performance' },
      { bg1: '#0a2442', bg2: '#0369a1', accent: '#38bdf8', label: 'Performance' },
      { bg1: '#1e3a5f', bg2: '#2563eb', accent: '#93c5fd', label: 'Performance' },
      { bg1: '#0f172a', bg2: '#1e40af', accent: '#60a5fa', label: 'Performance' },
    ],
    '콘텐츠마케팅': [
      { bg1: '#2a0e52', bg2: '#7b2fbf', accent: '#c084fc', label: 'Contents' },
      { bg1: '#3b0764', bg2: '#9333ea', accent: '#d8b4fe', label: 'Contents' },
      { bg1: '#1e0030', bg2: '#6d28d9', accent: '#a78bfa', label: 'Contents' },
      { bg1: '#2d1060', bg2: '#c026d3', accent: '#e879f9', label: 'Contents' },
    ],
    '디자인': [
      { bg1: '#082c22', bg2: '#0f7a56', accent: '#34d399', label: 'Design' },
      { bg1: '#052e16', bg2: '#16a34a', accent: '#86efac', label: 'Design' },
      { bg1: '#0c2a2a', bg2: '#0d9488', accent: '#5eead4', label: 'Design' },
      { bg1: '#1a2e05', bg2: '#4d7c0f', accent: '#bef264', label: 'Design' },
    ],
    'AI': [
      { bg1: '#160a38', bg2: '#5b21b6', accent: '#818cf8', label: 'AI' },
      { bg1: '#0f0a2a', bg2: '#4338ca', accent: '#a5b4fc', label: 'AI' },
      { bg1: '#1e1b4b', bg2: '#7c3aed', accent: '#c4b5fd', label: 'AI' },
      { bg1: '#0a0a1a', bg2: '#6366f1', accent: '#e0e7ff', label: 'AI' },
    ],
  }
  const hash = title.split('').reduce((h, c) => (((h << 5) - h) + c.charCodeAt(0)) | 0, 0)
  const set = paletteSets[category] || [{ bg1: '#111', bg2: '#333', accent: '#888', label: '' }]
  const p = set[Math.abs(hash) % set.length]

  // 그라디언트 배경
  const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height)
  grad.addColorStop(0, p.bg1)
  grad.addColorStop(1, p.bg2)
  ctx.fillStyle = grad
  ctx.fillRect(0, 0, canvas.width, canvas.height)

  // 서브 그라디언트 (우하단 하이라이트)
  const glow = ctx.createRadialGradient(canvas.width, canvas.height, 0, canvas.width, canvas.height, 500)
  glow.addColorStop(0, p.accent + '30')
  glow.addColorStop(1, 'transparent')
  ctx.fillStyle = glow
  ctx.fillRect(0, 0, canvas.width, canvas.height)

  // 카테고리 뱃지
  const badgeText = p.label
  ctx.font = '600 14px Pretendard, -apple-system, sans-serif'
  const bw = ctx.measureText(badgeText).width + 32
  ctx.fillStyle = p.accent + '28'
  const bx = 48, by = 52
  ctx.beginPath()
  ctx.roundRect(bx, by, bw, 32, 8)
  ctx.fill()
  ctx.fillStyle = p.accent
  ctx.fillText(badgeText, bx + 16, by + 21)

  // 제목 텍스트 (줄바꿈)
  const maxW = canvas.width - 96
  let fontSize = 40
  ctx.font = `800 ${fontSize}px Pretendard, -apple-system, sans-serif`
  while (ctx.measureText(title).width > maxW * 2.2 && fontSize > 24) {
    fontSize -= 2
    ctx.font = `800 ${fontSize}px Pretendard, -apple-system, sans-serif`
  }
  const lineH = fontSize * 1.45
  const words = title.split(' ')
  const lines = []
  let cur = ''
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w }
    else cur = test
  }
  if (cur) lines.push(cur)
  const totalH = lines.length * lineH
  const startY = (canvas.height - totalH) / 2 + fontSize * 0.35
  ctx.fillStyle = '#ffffff'
  lines.forEach((line, i) => {
    ctx.fillText(line, 48, startY + i * lineH)
  })

  // TAGby 브랜딩
  ctx.font = '700 16px Pretendard, -apple-system, sans-serif'
  ctx.fillStyle = 'rgba(255,255,255,0.4)'
  ctx.fillText('TAGby', 48, canvas.height - 36)

  // 하단 라인 액센트
  ctx.fillStyle = p.accent + '60'
  ctx.fillRect(48, canvas.height - 28, 40, 3)

  return new Promise((resolve, reject) => {
    canvas.toBlob(async (blob) => {
      try {
        const file = new File([blob], 'cover-auto.jpg', { type: 'image/jpeg' })
        const url = await uploadImage(file)
        resolve(url)
      } catch (e) { reject(e) }
    }, 'image/jpeg', 0.92)
  })
}

// ── 게시 ──────────────────────────────────────────────────────
async function saveDraft() { await submit('draft') }
async function publish()   { await submit('published') }

async function submit(status) {
  const title      = document.getElementById('fTitle').value.trim()
  const subtitle   = document.getElementById('fSubtitle').value.trim()
  const category   = document.getElementById('fCategory').value
  const slug       = document.getElementById('fSlug').value.trim()
  const validSources = sources.filter(s => s.name.trim() || s.url.trim())
  const sourceName = validSources.map(s => s.name.trim()).join('||')
  const sourceUrl  = validSources.map(s => s.url.trim()).join('||')
  const bodyHtml   = (articleType === 'text' && quill) ? quill.root.innerHTML.trim() : null
  const btn        = document.getElementById('publishBtn')

  if (!title)    return showToast('제목을 입력해주세요', 'error')
  if (!category) return showToast('카테고리를 선택해주세요', 'error')
  if (!slug)     return showToast('슬러그를 입력해주세요', 'error')
  if (articleType === 'text' && (!quill || quill.getText().trim() === '')) return showToast('본문을 입력해주세요', 'error')
  if (articleType === 'card-news' && slides.length === 0) return showToast('슬라이드 이미지를 최소 1장 올려주세요', 'error')

  btn.disabled = true
  btn.textContent = '게시 중...'

  // 커버 이미지 없으면 자동 생성
  if (!coverUrl) {
    try {
      btn.textContent = '커버 이미지 생성 중...'
      coverUrl = await generateCoverImage(title, category)
      document.getElementById('coverPreview').src = coverUrl
      document.getElementById('coverPreviewWrap').style.display = 'block'
      document.getElementById('coverPlaceholder').style.display = 'none'
    } catch (e) {
      // 실패해도 계속 진행
    }
    btn.textContent = '게시 중...'
  }

  try {
    const res = await fetch('/api/article-save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({
        slug,
        title,
        subtitle: subtitle || null,
        body_html: bodyHtml || null,
        category,
        tags,
        cover_url: coverUrl,
        article_type: articleType,
        slides: articleType === 'card-news' ? slides : undefined,
        status,
        author_name: currentUser?.name,
        source_name: sourceName || null,
        source_url:  sourceUrl  || null
      })
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error)

    const url = 'https://mkt.tagby.io/article-view.html?slug=' + data.slug
    try { localStorage.removeItem(DRAFT_KEY) } catch {}
    showToast(status === 'published' ? '게시 완료!' : '임시저장 완료!', 'success')
    setTimeout(() => {
      if (confirm(status === 'published' ? '게시된 아티클을 확인할까요?\n' + url : '저장되었습니다.')) {
        if (status === 'published') window.open(url, '_blank')
      }
    }, 500)
  } catch (err) {
    showToast(err.message, 'error')
  } finally {
    btn.disabled = false
    btn.textContent = '아티클 게시'
  }
}

// ── 유틸 ──────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

let toastTimer = null
function showToast(msg, type) {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.className = 'toast show ' + type
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { el.className = 'toast ' + type }, 3000)
}
</script>
