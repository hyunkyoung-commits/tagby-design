<script>
// ── 캐러셀 상태 ───────────────────────────────────────────────
var carouselIndex = 0
var carouselTotal = 0
var carouselSlides = []

function carouselMove(dir) {
  carouselIndex = Math.max(0, Math.min(carouselTotal - 1, carouselIndex + dir))
  updateCarousel()
}

function goToSlide(i) {
  carouselIndex = i
  updateCarousel()
}

function updateCarousel() {
  document.getElementById('carouselTrack').style.transform = 'translateX(-' + (carouselIndex * 100) + '%)'
  document.getElementById('carouselCounter').textContent = (carouselIndex + 1) + ' / ' + carouselTotal
  document.getElementById('carouselPrev').style.opacity = carouselIndex === 0 ? '0.3' : '1'
  document.getElementById('carouselNext').style.opacity = carouselIndex === carouselTotal - 1 ? '0.3' : '1'
  var dots = document.getElementById('carouselDots').querySelectorAll('.carousel-dot')
  dots.forEach(function(d, i) { d.classList.toggle('active', i === carouselIndex) })
  var cap = carouselSlides[carouselIndex]
  var capEl = document.getElementById('carouselCaption')
  if (capEl) capEl.textContent = (cap && cap.caption) ? cap.caption : ''
}

// ── 아티클 로드 ───────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  var params = new URLSearchParams(window.location.search)
  var slug = params.get('slug')
  if (!slug) { showError(); return }
  loadArticle(slug)
  initNav()
  initScroll()
})

async function loadArticle(slug) {
  try {
    var res = await fetch('/api/article-get?slug=' + encodeURIComponent(slug))
    if (!res.ok) throw new Error('not found')
    var data = await res.json()
    renderArticle(data)
  } catch {
    showError()
  }
}

function renderArticle(a) {
  var pageUrl = 'https://mkt.tagby.io/article-view.html?slug=' + encodeURIComponent(a.slug)
  var dateStr = (a.published_at || a.date || '').slice(0, 10).replace(/-/g, '. ')

  // 메타 업데이트
  var titleFull = a.title + ' - TAGby 태그바이'
  document.title = titleFull
  setMeta('metaTitle',    titleFull)
  setMeta('metaDesc',     a.subtitle || a.title)
  setMeta('ogTitle',      titleFull)
  setMeta('ogDesc',       a.subtitle || a.title)
  setMeta('ogUrl',        pageUrl)
  if (a.cover_url) setMeta('ogImage', a.cover_url)
  document.getElementById('canonicalLink').href = pageUrl

  // 헤더 정보
  document.getElementById('artCategory').textContent = a.category
  document.getElementById('artDate').textContent     = dateStr
  if (a.author_name) document.getElementById('artAuthor').textContent = '작성: ' + a.author_name
  document.getElementById('artTitle').textContent    = a.title
  if (a.subtitle) {
    document.getElementById('artSubtitle').textContent = a.subtitle
  } else {
    document.getElementById('artSubtitle').style.display = 'none'
  }

  // 태그
  if (a.tags && a.tags.length > 0) {
    document.getElementById('artTags').innerHTML = a.tags.map(function(t) {
      return '<span style="background:#1e1e1e;border:1px solid #2d2d2d;border-radius:20px;padding:4px 12px;font-size:12px;color:#9CA3AF;">#' + escHtml(t) + '</span>'
    }).join('')
  }

  if (a.article_type === 'card-news') {
    // 카드뉴스 캐러셀 (slides: [{url, caption}] 또는 구버전 [url] 호환)
    var rawSlides = a.slides || []
    carouselSlides = rawSlides.map(function(s) {
      return typeof s === 'string' ? { url: s, caption: null } : s
    })
    carouselTotal = carouselSlides.length
    document.getElementById('carouselWrap').style.display = 'block'
    document.getElementById('carouselTrack').innerHTML = carouselSlides.map(function(s, i) {
      return '<div class="carousel-slide"><img src="' + s.url + '" alt="슬라이드 ' + (i+1) + '" style="width:100%;display:block;"></div>'
    }).join('')
    document.getElementById('carouselDots').innerHTML = carouselSlides.map(function(_, i) {
      return '<div class="carousel-dot' + (i===0?' active':'') + '" onclick="goToSlide(' + i + ')"></div>'
    }).join('')
    document.getElementById('carouselCounter').textContent = '1 / ' + carouselSlides.length
    var capEl = document.getElementById('carouselCaption')
    if (capEl) capEl.textContent = (carouselSlides[0] && carouselSlides[0].caption) ? carouselSlides[0].caption : ''
    document.getElementById('carouselPrev').style.opacity = '0.3'
    if (carouselSlides.length <= 1) document.getElementById('carouselNext').style.opacity = '0.3'
  } else {
    // 텍스트 아티클
    if (a.cover_url) {
      document.getElementById('artCover').src = a.cover_url
      document.getElementById('artCover').alt = a.title
      document.getElementById('coverWrap').style.display = 'block'
    }
    document.getElementById('artBody').innerHTML = a.body_html || ''
  }

  // 작성자 표시 (DB 아티클, author_name 있을 때만)
  if (a.author_name) {
    var authorEl = document.getElementById('artAuthor')
    document.getElementById('artAuthorName').textContent = a.author_name
    document.getElementById('artAuthorAvatar').textContent = a.author_name.charAt(0)
    authorEl.style.display = 'flex'
  }

  // 추천 아티클 로드
  loadRelated(a.slug, a.category, a.tags || [])

  // 스켈레톤 → 콘텐츠
  document.getElementById('loadingSkeleton').style.display = 'none'
  document.getElementById('articleContent').style.display = 'block'
}

function showError() {
  document.getElementById('loadingSkeleton').style.display = 'none'
  document.getElementById('errorContent').style.display = 'block'
}

// ── 추천 아티클 ───────────────────────────────────────────────
async function loadRelated(slug, cat, myTags) {
  try {
    // articles.json (기존 정적 아티클) + Supabase DB 병합
    var [staticRes, dbRes] = await Promise.allSettled([
      fetch('https://mkt.tagby.io/articles.json'),
      fetch('/api/article-list-db')
    ])

    var all = []
    if (staticRes.status === 'fulfilled' && staticRes.value.ok) {
      var staticArticles = await staticRes.value.json()
      all = all.concat(staticArticles.map(function(a) { return Object.assign({}, a, { _viewUrl: 'https://mkt.tagby.io/design-study-article/' + a.slug + '.html' }) }))
    }
    if (dbRes.status === 'fulfilled' && dbRes.value.ok) {
      var dbArticles = await dbRes.value.json()
      all = all.concat(dbArticles.map(function(a) { return Object.assign({}, a, { _viewUrl: 'https://mkt.tagby.io/article-view.html?slug=' + encodeURIComponent(a.slug) }) }))
    }

    var candidates = all.filter(function(a) { return a.slug !== slug })
    candidates = candidates.map(function(a) {
      var overlap = 0
      if (myTags.length > 0 && a.tags) {
        myTags.forEach(function(t) { if (a.tags.indexOf(t) !== -1) overlap++ })
      }
      a._score = overlap * 10 + (a.category === cat ? 1 : 0)
      return a
    })
    candidates.sort(function(a, b) { return b._score - a._score })
    var picks = candidates.slice(0, 3)
    var grid = document.getElementById('related-grid')
    if (!grid || picks.length === 0) return

    grid.innerHTML = picks.map(function(a) {
      var coverHtml = a.cover
        ? '<img src="https://mkt.tagby.io/' + a.cover + '" alt="' + escHtml(a.title) + '" style="width:100%;height:100%;object-fit:cover;">'
        : '<img src="https://mkt.tagby.io/design-study-article/thum/' + a.slug + '.png" alt="' + escHtml(a.title) + '" style="width:100%;height:100%;object-fit:cover;">'
      return '<a href="' + (a._viewUrl || '#') + '" '
        + 'style="display:block;background:#1F1F1F;border-radius:12px;overflow:hidden;text-decoration:none;transition:background 0.2s;" '
        + 'onmouseover="this.style.background=\'#2A2A2A\'" onmouseout="this.style.background=\'#1F1F1F\'">'
        + '<div style="aspect-ratio:4/3;overflow:hidden;background:#111;">' + coverHtml + '</div>'
        + '<div style="padding:0.875rem;">'
        + '<p style="font-size:0.7rem;color:#0078F0;font-weight:600;margin:0 0 0.35rem;">' + escHtml(a.category) + '</p>'
        + '<p style="font-size:0.82rem;font-weight:700;color:#fff;margin:0 0 0.4rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">' + escHtml(a.title) + '</p>'
        + '<p style="font-size:0.72rem;color:#6B7280;margin:0;">' + escHtml(a.date || '') + '</p>'
        + '</div></a>'
    }).join('')
  } catch(e) {}
}

// ── 네비게이션 ────────────────────────────────────────────────
function initNav() {
  var header = document.getElementById('header')
  var hamburger = document.getElementById('hamburger')
  var mobileMenu = document.getElementById('mobileMenu')
  var mobileOverlay = document.getElementById('mobileOverlay')

  window.addEventListener('scroll', function() {
    header.style.padding = window.scrollY > 50 ? '0' : ''
  })

  hamburger.addEventListener('click', function() {
    hamburger.classList.toggle('active')
    mobileMenu.classList.toggle('active')
    mobileOverlay.classList.toggle('active')
  })
  mobileOverlay.addEventListener('click', function() {
    hamburger.classList.remove('active')
    mobileMenu.classList.remove('active')
    mobileOverlay.classList.remove('active')
  })

  document.querySelectorAll('.dropdown').forEach(function(d) {
    var menu = d.querySelector('.dropdown-menu')
    if (!menu) return
    d.addEventListener('mouseenter', function() {
      menu.style.display = 'block'
      setTimeout(function() { menu.style.opacity = '1'; menu.style.transform = 'translateY(0)'; }, 10)
    })
    d.addEventListener('mouseleave', function() {
      menu.style.opacity = '0'; menu.style.transform = 'translateY(-10px)'
      setTimeout(function() { menu.style.display = 'none' }, 200)
    })
  })
}

function initScroll() {
  var scrollTopBtn = document.getElementById('scrollTop')
  window.addEventListener('scroll', function() {
    scrollTopBtn.classList.toggle('visible', window.scrollY > 400)
  })
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function setMeta(id, content) {
  var el = document.getElementById(id)
  if (el) {
    if (el.tagName === 'META') el.setAttribute('content', content)
    else el.textContent = content
  }
}
</script>
